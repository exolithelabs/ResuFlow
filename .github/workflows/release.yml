name: Release

# Push a tag like v0.3.0 (matching the version in package.json, Cargo.toml and tauri.conf.json).
# Every platform builds into a draft release; it is published only once all of them succeeded and
# the updater manifest lists each one, because installed apps check releases/latest for updates.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY           required: signs updates (pair of the pubkey in tauri.conf.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  if the key has a password
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#                                       optional: Developer ID signing and notarization for macOS.
#                                       Without them the app is ad-hoc signed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_v=$(jq -r .version package.json)
          tauri_v=$(jq -r .version src-tauri/tauri.conf.json)
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag $tag · package.json $npm_v · tauri.conf.json $tauri_v · Cargo.toml $cargo_v"
          [ "$tag" = "$npm_v" ] && [ "$tag" = "$tauri_v" ] && [ "$tag" = "$cargo_v" ] || {
            echo "::error::Tag v$tag does not match the versions in package.json, tauri.conf.json and Cargo.toml"; exit 1; }

      - name: Signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: '[ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm run check

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04's older glibc lets the AppImage run on more distributions.
          - os: ubuntu-22.04
            args: --bundles appimage
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Pass the Apple variables on only when they are set: the bundler treats an empty one as configured.
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
            done
          else
            echo "No Apple certificate configured: ad-hoc signing."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ResuFlow ${{ github.ref_name }}
          releaseBody: |
            Download the file for your system:

            - **Linux**: `ResuFlow_*.AppImage` (make it executable, then run it)
            - **Windows**: `ResuFlow_*-setup.exe`
            - **macOS** (Apple silicon and Intel): `ResuFlow_*.dmg`

            Already installed? ResuFlow offers the update itself (About → Check for updates).
            Third-party notices are in About → Licenses and in `THIRD_PARTY_LICENSES.md`.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Updater manifest lists every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest
          jq . manifest/latest.json
          for p in linux-x86_64 windows-x86_64 darwin-aarch64 darwin-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url and (.platforms[$p].signature | length > 0)' manifest/latest.json > /dev/null \
              || { echo "::error::latest.json has no signed entry for $p"; exit 1; }
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
