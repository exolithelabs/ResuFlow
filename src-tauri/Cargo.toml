[package]
name = "resuflow"
version = "0.2.0"
description = "Local-first resume builder with a native desktop app and a stdio MCP server for AI agents."
authors = ["Dhiraj Yadav"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "resuflow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
dirs = "6"
# Signed in-app updates. Verifying signatures and swapping a running AppImage, .app bundle or NSIS
# install is easy to get subtly wrong; this is Tauri's own audited implementation. rustls avoids
# depending on the system's OpenSSL.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already part of Tauri's Linux stack; used directly for print-to-PDF.
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
